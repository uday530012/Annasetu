<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FoodLoop AI - Food Requests</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f7f4;color:#222}.nav{background:#176b24;color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:22px;font-weight:700}.nav a{color:#fff;text-decoration:none;font-weight:700;margin-left:18px}.wrap{max-width:1100px;margin:30px auto;padding:0 18px}.head{background:#fff;border-radius:16px;padding:24px;box-shadow:0 5px 20px rgba(0,0,0,.07)}h1{color:#176b24;margin:0 0 8px}.list{margin-top:20px;display:grid;gap:15px}.card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 4px 15px rgba(0,0,0,.07);border-left:5px solid #2b8738}.title{font-size:19px;font-weight:700;color:#176b24}.status{display:inline-block;padding:5px 10px;border-radius:20px;font-size:13px;font-weight:700;background:#eef7ef;color:#176b24;margin-left:8px}.row{margin:7px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{border:0;border-radius:8px;padding:10px 15px;color:#fff;font-weight:700;cursor:pointer}.accept{background:#2b8738}.reject{background:#d32f2f}.collect{background:#1976d2}.msg{margin-top:10px;padding:9px;border-radius:8px;background:#eef7ef}.empty{background:#fff;padding:28px;border-radius:14px;text-align:center;color:#666;margin-top:20px}
</style></head><body>
<div class="nav"><div class="brand">🍱 FoodLoop AI</div><div><a href="/provider-dashboard">Dashboard</a><a href="/available-foods">Available Food</a><a href="/logout">Logout</a></div></div>
<div class="wrap"><div class="head"><h1>📦 Food Requests</h1><p>View and manage food requests connected to your account.</p></div><div id="list" class="list"></div></div>
<script>
const requests={{ food_requests|tojson }};const role={{ '"' + (user.role if user else '') + '"' if false else 'null' }};
const userRole={{ ('"'+user.role+'"') if user else 'null' }};
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){const el=document.getElementById('list');if(!requests.length){el.innerHTML='<div class="empty">No food requests found.</div>';return}el.innerHTML=requests.map(r=>{const st=String(r.status||'pending').toLowerCase();let actions='';if(userRole==='provider'&&st==='pending')actions=`<button class="btn accept" onclick="updateStatus(${Number(r.id)},'accepted')">✅ Accept</button><button class="btn reject" onclick="updateStatus(${Number(r.id)},'rejected')">❌ Reject</button>`;if(userRole==='receiver'&&st==='accepted')actions=`<button class="btn collect" onclick="collectFood(${Number(r.food_id)})">🤝 Mark Collected</button>`;return `<div class="card"><div class="title">📦 ${esc(r.food_name||'Food')} <span class="status">${esc(String(r.status||'PENDING').toUpperCase())}</span></div><div class="row"><b>Quantity:</b> ${esc(r.quantity)}</div><div class="row"><b>Food Type:</b> ${esc(r.food_type)}</div><div class="row"><b>Provider:</b> ${esc(r.provider_name)}</div><div class="row"><b>Receiver:</b> ${esc(r.receiver_name)}</div><div class="row"><b>Organization:</b> ${esc(r.receiver_organization)}</div><div class="row"><b>Contact:</b> ${esc(r.receiver_contact)}</div><div class="row"><b>Requested:</b> ${esc(r.requested_at||r.created_at||'')}</div>${actions?`<div class="actions">${actions}</div>`:''}<div id="m-${Number(r.id)}"></div></div>`}).join('')}
async function updateStatus(id,status){try{const r=await fetch('/food-request/'+id+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});const j=await r.json().catch(()=>({success:false,message:'Invalid response'}));const m=document.getElementById('m-'+id);m.className='msg';m.textContent=j.message||'Updated';if(r.ok&&j.success)setTimeout(()=>location.reload(),700)}catch(e){const m=document.getElementById('m-'+id);m.className='msg';m.textContent='Server error.'}}
async function collectFood(foodId){try{const r=await fetch('/food/'+foodId+'/collected',{method:'POST'});const j=await r.json().catch(()=>({success:false,message:'Invalid response'}));if(r.ok&&j.success){alert(j.message||'Food marked as collected.');location.reload()}else alert(j.message||'Unable to mark collected.')}catch(e){alert('Server error. Please try again.')}}
render();
</script></body></html>
