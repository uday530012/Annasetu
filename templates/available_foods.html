<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FoodLoop AI - Available Food</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f7f4;color:#222}.nav{background:#176b24;color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:22px;font-weight:700}.nav a{color:#fff;text-decoration:none;font-weight:700;margin-left:18px}.wrap{max-width:1100px;margin:30px auto;padding:0 18px}.head{background:#fff;border-radius:16px;padding:24px;box-shadow:0 5px 20px rgba(0,0,0,.07)}h1{color:#176b24;margin:0 0 8px}.toolbar{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}.toolbar input,.toolbar select{padding:11px;border:1px solid #ccd5cf;border-radius:8px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px;margin-top:20px}.card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 4px 15px rgba(0,0,0,.07);border-left:5px solid #2b8738}.card h2{color:#176b24;font-size:20px;margin:0 0 12px}.row{margin:7px 0}.tag{display:inline-block;background:#e7f6e9;color:#176b24;padding:5px 9px;border-radius:20px;font-size:13px;font-weight:700}.btn{border:0;border-radius:8px;padding:10px 15px;background:#2b8738;color:#fff;font-weight:700;cursor:pointer}.btn.blue{background:#1976d2}.empty{background:#fff;padding:28px;border-radius:14px;text-align:center;color:#666;margin-top:20px}.status{margin-top:10px;padding:9px;border-radius:8px;background:#eef7ef}.maplink{display:inline-block;margin-top:8px;color:#1976d2;font-weight:700;text-decoration:none}
</style></head><body>
<div class="nav"><div class="brand">🍱 FoodLoop AI</div><div><a href="/provider-dashboard">Dashboard</a><a href="/food-requests">Requests</a><a href="/logout">Logout</a></div></div>
<div class="wrap"><div class="head"><h1>📍 Available Food</h1><p>Food currently available in the FoodLoop network.</p><div class="toolbar"><input id="search" placeholder="Search food or location"><select id="type"><option value="">All Types</option><option value="vegetarian">Vegetarian</option><option value="non-vegetarian">Non-Vegetarian</option></select><button class="btn blue" onclick="filterCards()">🔎 Search</button><button class="btn" onclick="location.reload()">🔄 Refresh</button></div></div>
<div id="cards" class="cards"></div></div>
<script>
const foods={{ food|tojson }};const isReceiver={{ 'true' if user and user.role=='receiver' else 'false' }};
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(list){const c=document.getElementById('cards');if(!list.length){c.innerHTML='<div class="empty">No available food found.</div>';return}c.innerHTML=list.map(f=>`<div class="card"><h2>🍱 ${esc(f.food_name)}</h2><div class="row"><span class="tag">${esc(f.food_type)}</span></div><div class="row"><b>Quantity:</b> ${esc(f.quantity)}</div><div class="row"><b>Provider:</b> ${esc(f.provider_name)}</div><div class="row"><b>Pickup:</b> ${esc(f.location||f.pickup_location)}</div><div class="row"><b>Available Until:</b> ${esc(f.available_until||'Not specified')}</div>${f.latitude&&f.longitude?`<a class="maplink" target="_blank" href="https://www.google.com/maps?q=${encodeURIComponent(f.latitude+','+f.longitude)}">📍 Open Location</a>`:''}${isReceiver?`<div style="margin-top:15px"><button class="btn" onclick="requestFood(${Number(f.id)})">🤝 Request Food</button></div>`:''}<div id="s-${Number(f.id)}"></div></div>`).join('')}
function filterCards(){const q=document.getElementById('search').value.toLowerCase();const t=document.getElementById('type').value;render(foods.filter(f=>(!q||String(f.food_name||'').toLowerCase().includes(q)||String(f.location||'').toLowerCase().includes(q))&&(!t||String(f.food_type||'').toLowerCase().replace(/\s+/g,'-')===t)))}
async function requestFood(id){const name=prompt('Receiver name:');if(!name)return;const contact=prompt('Receiver contact number:');if(!contact)return;const org=prompt('Organization / Ashram / NGO name:','FoodLoop Receiver')||'FoodLoop Receiver';const box=document.getElementById('s-'+id);try{const r=await fetch('/request-food',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({food_id:id,receiver_name:name,receiver_contact:contact,receiver_organization:org})});const j=await r.json().catch(()=>({success:false,message:'Invalid server response'}));box.className='status';box.textContent=j.message||'Request submitted.';if(r.ok&&j.success)setTimeout(()=>location.reload(),800)}catch(e){box.className='status';box.textContent='Server error. Please try again.'}}
render(foods);
</script></body></html>
